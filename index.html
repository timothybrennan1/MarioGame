// ─── Texture factory ────────────────────────────────────────────────────────
function makeTextures(scene) {
  const g = scene.make.graphics({ add: false });

  function gen(key, w, h, fn) {
    g.clear();
    fn(g);
    g.generateTexture(key, w, h);
  }

  // Player idle
  gen('p_idle', 28, 40, g => {
    g.fillStyle(0x8B4513); g.fillRect(6,0,16,6);           // hair

    g.fillStyle(0x000000); g.fillRect(9,9,4,4); g.fillRect(17,9,4,4); // eyes
    g.fillStyle(0x3D7AE5); g.fillRect(7,17,14,13);         // shirt

    g.fillStyle(0x7B5C2A); g.fillRect(7,30,5,8); g.fillRect(16,30,5,8); // legs
    g.fillStyle(0x3D1C02); g.fillRect(6,36,7,5); g.fillRect(15,36,7,5); // boots
  });

  // Player run1
  gen('p_run1', 28, 40, g => {
    g.fillStyle(0x8B4513); g.fillRect(6,0,16,6);
    g.fillStyle(0xFFCBA4); g.fillRect(6,4,16,13);
    g.fillStyle(0x000000); g.fillRect(9,9,4,4); g.fillRect(17,9,4,4);
    g.fillStyle(0x3D7AE5); g.fillRect(7,17,14,13);
    g.fillStyle(0xFFCBA4); g.fillRect(2,16,4,8); g.fillRect(22,20,4,8);
    g.fillStyle(0x7B5C2A); g.fillRect(6,30,6,8); g.fillRect(17,30,5,7);

  // Player run2
  gen('p_run2', 28, 40, g => {
    g.fillStyle(0x8B4513); g.fillRect(6,0,16,6);
    g.fillStyle(0xFFCBA4); g.fillRect(6,4,16,13);
    g.fillStyle(0x000000); g.fillRect(9,9,4,4); g.fillRect(17,9,4,4);

  // Spike
  gen('spike', 32, 28, g => {

  // Bush
  gen('bush', 48, 28, g => {
    g.fillStyle(0x388E3C); g.fillCircle(24,20,20); g.fillCircle(10,22,14); g.fillCircle(38,22,14);
    g.fillStyle(0x4CAF50); g.fillCircle(18,12,12); g.fillCircle(30,10,10);
  });

  // Cloud
  gen('cloud', 80, 36, g => {
    g.fillStyle(0xFFFFFF);
    g.fillCircle(20,22,16); g.fillCircle(40,16,20); g.fillCircle(60,22,16);
    g.fillRect(4,22,72,14);
  });

  // Flower
  gen('flower', 16, 28, g => {
    g.fillStyle(0x4CAF50); g.fillRect(6,14,4,14);
    g.fillStyle(0xFFEB3B); g.fillCircle(8,10,7);

  // Heart (UI)
  gen('heart', 20, 18, g => {
    g.fillStyle(0xFF1744);
    g.fillCircle(6,6,6); g.fillCircle(14,6,6);

  // Tall flag pole shaft
  gen('pole_shaft', 12, 300, g => {
    g.fillStyle(0xB8860B); g.fillRect(4,0,4,300);   // shadow side

  // Flag banner
  gen('flag_banner', 56, 40, g => {

// ─── Title Scene ─────────────────────────────────────────────────────────────
class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }

  create() {
    makeTextures(this);

    // Sky
    this.add.rectangle(0,0,W,H,0x87CEEB).setOrigin(0);

    // BG trees
    for (let x = 40; x < W; x += 110) {
      this.add.image(x, H-32, 'bg_trunk').setOrigin(0.5,1).setAlpha(0.6);
      this.add.image(x, H-82, 'bg_leaves').setOrigin(0.5,1).setAlpha(0.6);
    }

    // Ground strip
    for (let x = 0; x < W; x += 32)
      this.add.image(x+16, H-16, 'ground');

    // Clouds
    [80,300,600].forEach((x,i) =>
      this.add.image(x, 50+i*20, 'cloud').setAlpha(0.85));

    this.add.text(W/2, 95, 'Forest Adventure', {
      fontSize:'52px', color:'#2E7D32', stroke:'#fff', strokeThickness:7,
      fontStyle:'bold', fontFamily:'Georgia, serif'
    }).setOrigin(0.5);

    this.add.text(W/2, 158, '— A Bright Forest Platformer —', {
      fontSize:'18px', color:'#555', stroke:'#fff', strokeThickness:3
    }).setOrigin(0.5);

    const lines = [
      '  Arrow Keys or WASD   →   Move & Jump',
      '  Jump ON enemies to stomp them  (+100 pts)',
      '  Collect gold coins  (+10 pts)',
      '  Avoid spikes and enemy sides!',
      '  Reach the golden flag to win!',
    ];
    lines.forEach((l,i) =>
      this.add.text(W/2, 210+i*30, l, {
        fontSize:'15px', color:'#1B5E20', stroke:'#e8ffe8', strokeThickness:3
      }).setOrigin(0.5));

    const blink = this.add.text(W/2, 390, 'Press any key or click to begin', {
      fontSize:'22px', color:'#E65100', stroke:'#000', strokeThickness:3,
      fontStyle:'bold'
    }).setOrigin(0.5);
    this.tweens.add({ targets:blink, alpha:0.15, duration:650, yoyo:true, repeat:-1 });

    this.input.keyboard.once('keydown', () => this.scene.start('Game'));
    this.input.once('pointerdown', () => this.scene.start('Game'));
  }
}

// ─── Main Game Scene ──────────────────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init() {
    this.score = 0;
    this.lives = 3;
    this.invincible = false;
    this.facing = 1;
    this.animT = 0;
    this.animF = 0;
  }

  create() {
    this.physics.world.setBounds(0, 0, WORLD_W, H + 200);
    this.cameras.main.setBounds(0, 0, WORLD_W, H);

    this._buildBackground();
    this._buildLevel();
    this._buildDecorations();
    this._createPlayer();
    this._createUI();
    this._setupInput();
    this._setupCollisions();

    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
  }

  _buildBackground() {
    // Sky
    this.add.rectangle(0,0,WORLD_W,H,0x87CEEB).setOrigin(0).setDepth(-10);

    // Sun
    this.add.arc(120, 75, 42, 0, 360, false, 0xFFF176).setScrollFactor(0.05).setDepth(-9);
    this.add.arc(120, 75, 34, 0, 360, false, 0xFFEE58).setScrollFactor(0.05).setDepth(-9);

    // Clouds (parallax)
    for (let x = 0; x < WORLD_W; x += 400 + Phaser.Math.Between(-60,60)) {
      this.add.image(x, Phaser.Math.Between(30,90), 'cloud')
        .setScrollFactor(0.18).setDepth(-8).setAlpha(0.82)
        .setScale(Phaser.Math.FloatBetween(0.7,1.3));
    }
  }

  _buildLevel() {
    // ── BG trees ──
    for (let x = 60; x < WORLD_W; x += 190 + Phaser.Math.Between(-30,30)) {
      this.add.image(x, H-32, 'bg_trunk').setScrollFactor(0.3).setOrigin(0.5,1).setDepth(-7);
      this.add.image(x, H-32-50, 'bg_leaves').setScrollFactor(0.3).setOrigin(0.5,1).setDepth(-7).setAlpha(0.75);
    }

    // ── Ground ──
    this.ground = this.physics.add.staticGroup();
    for (let x = 0; x < WORLD_W; x += 32) {
      const inGap = GROUND_GAPS.some(([l,r]) => x >= l && x < r);
      if (!inGap) {
        this.ground.create(x+16, H-16, 'ground').refreshBody();
      }
    }

    // ── Platforms ──
    this.platforms = this.physics.add.staticGroup();
    PLATFORMS.forEach(({x,y,n}) => {
      for (let i = 0; i < n; i++)
        this.platforms.create(x + i*32+16, y, 'platform').setSize(32,8).setOffset(0,16).refreshBody();
    });

    // ── Spikes ──
    this.spikes = this.physics.add.staticGroup();
    SPIKE_XS.forEach(x => {
      this.spikes.create(x, H-46, 'spike').setSize(30,20).setOffset(1,8).refreshBody();
    });

    // ── Coins ──
    this.coins = this.physics.add.staticGroup();
    COINS.forEach(({x,y}) => this.coins.create(x,y,'coin').refreshBody());

    // ── Goal flag pole at end ──
    this.goalX = WORLD_W - 80;
    const poleX = this.goalX;
    const groundY = H - 32; // top of ground

    // Pedestal
    this.add.image(poleX, groundY, 'pole_base').setOrigin(0.5, 1).setDepth(3);
    // Pole shaft — tall
    this.add.image(poleX, groundY - 16, 'pole_shaft').setOrigin(0.5, 1).setDepth(3);
    // Ball on top
    this.add.image(poleX, groundY - 16 - 300, 'pole_top').setOrigin(0.5, 1).setDepth(3);
    // Flag banner hanging from near the top
    this.add.image(poleX + 6, groundY - 16 - 285, 'flag_banner').setOrigin(0, 0.5).setDepth(3);

    // Invisible win-detection zone spanning the pole height
    const goalZone = this.add.zone(poleX, groundY - 170, 40, 340).setOrigin(0.5);
    this.physics.add.existing(goalZone, true);
    this.goal = goalZone;

    // ── Enemies ──
    this.enemies = this.physics.add.group();
    ENEMIES.forEach(({x,l,r}) => {
      const e = this.enemies.create(x, H-80, 'e1');
      e.setGravityY(500);
      e.setVelocityX(-70);
      e.patrolL = l; e.patrolR = r;
      e.alive = true; e.et = 0;
    });
  }

  _buildDecorations() {
    // Foreground trees
    for (let x = 120; x < WORLD_W-100; x += 280+Phaser.Math.Between(-50,50)) {
      this.add.image(x, H-32, 'trunk').setOrigin(0.5,1).setDepth(-3).setScrollFactor(0.8);
      this.add.image(x, H-32-70, 'leaves').setOrigin(0.5,1).setDepth(-3).setScrollFactor(0.8);
    }

    // Bushes
    for (let x = 40; x < WORLD_W; x += 160+Phaser.Math.Between(-40,40))
      this.add.image(x, H-32-14, 'bush').setOrigin(0.5,1).setDepth(-2).setScrollFactor(0.95);

    // Flowers
    for (let x = 20; x < WORLD_W; x += 70+Phaser.Math.Between(-20,20))
      this.add.image(x, H-32-14, 'flower').setOrigin(0.5,1).setDepth(-1);
  }

  _createPlayer() {
    this.player = this.physics.add.sprite(80, H-120, 'p_idle');
    this.player.setGravityY(600);
    this.player.body.setMaxVelocity(400, 700);
    this.player.setCollideWorldBounds(true);
    this.player.setDepth(5);
  }

  _createUI() {
    this.livesIcons = [];
    for (let i = 0; i < 3; i++) {
      const h = this.add.image(16+i*26, 20, 'heart').setScrollFactor(0).setDepth(20).setScale(0.85);
      this.livesIcons.push(h);
    }
    this.scoreTxt = this.add.text(W-14, 12, 'Score: 0', {
      fontSize:'18px', color:'#fff', stroke:'#000', strokeThickness:4
    }).setScrollFactor(0).setDepth(20).setOrigin(1,0);

    // Pause button
    this.pauseBtn = this.add.text(W/2, 14, '❚❚  PAUSE', {
      fontSize:'15px', color:'#fff', stroke:'#000', strokeThickness:3,
      backgroundColor:'#00000055', padding:{ x:8, y:4 }
    }).setScrollFactor(0).setDepth(20).setOrigin(0.5, 0)
      .setInteractive({ useHandCursor: true });
    this.pauseBtn.on('pointerover', () => this.pauseBtn.setStyle({ color:'#FFD700' }));
    this.pauseBtn.on('pointerout',  () => this.pauseBtn.setStyle({ color:'#fff' }));
    this.pauseBtn.on('pointerdown', () => this._togglePause());

    // Pause overlay (hidden until paused)
    this.pauseOverlay = this.add.container(0, 0).setScrollFactor(0).setDepth(30).setVisible(false);
    const dim = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.6);
    const label = this.add.text(W/2, H/2 - 40, 'PAUSED', {
      fontSize:'56px', color:'#fff', stroke:'#000', strokeThickness:7, fontStyle:'bold'
    }).setOrigin(0.5);
    const hint = this.add.text(W/2, H/2 + 30, 'Press  P  or click  ❚❚ PAUSE  to resume', {
      fontSize:'18px', color:'#ccc', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5);
    this.pauseOverlay.add([dim, label, hint]);
  }

  _updateUI() {
    this.livesIcons.forEach((h,i) => h.setAlpha(i < this.lives ? 1 : 0.15));
    this.scoreTxt.setText('Score: ' + this.score);
  }

  _setupInput() {
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });
    this.pauseKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.P);
  }

  _togglePause() {
    this.gamePaused = !this.gamePaused;
    if (this.gamePaused) {
      this.physics.world.pause();
      this.pauseOverlay.setVisible(true);
      this.pauseBtn.setText('▶  RESUME');
    } else {
      this.physics.world.resume();
      this.pauseOverlay.setVisible(false);
      this.pauseBtn.setText('❚❚  PAUSE');
    }
  }

  _setupCollisions() {
    this.physics.add.collider(this.player, this.ground);
    this.physics.add.collider(this.player, this.platforms);
    this.physics.add.collider(this.enemies, this.ground);
    this.physics.add.collider(this.enemies, this.platforms);

    // Collect coins
    this.physics.add.overlap(this.player, this.coins, (_p, coin) => {
      coin.destroy();
      this.score += 10;
      this._updateUI();
      this._floatText(coin.x, coin.y, '+10', '#FFD700');
    });

    // Spikes
    this.physics.add.overlap(this.player, this.spikes, () => {
      if (!this.invincible) this._hitPlayer();
    });

    // Goal
    this.physics.add.overlap(this.player, this.goal, () => {
      this.scene.start('NameEntry', { score: this.score, won: true });
    });

    // Enemies
    this.physics.add.overlap(this.player, this.enemies, (_p, e) => {
      if (!e.alive || this.invincible) return;
      const pBot = this.player.y + this.player.displayHeight / 2;
      const eTop = e.y - e.displayHeight / 2;
      if (this.player.body.velocity.y > 50 && pBot < e.y + 6) {
        this._stompEnemy(e);
        this.player.setVelocityY(-340);
      } else {
        this._hitPlayer();
      }
    });
  }

  _stompEnemy(e) {
    e.alive = false;
    e.setTexture('e_dead');
    e.setVelocityX(0);
    this.score += 100;
    this._updateUI();
    this._floatText(e.x, e.y - 10, '+100', '#FF6B35');
    this.time.delayedCall(500, () => {
      this.tweens.add({ targets: e, alpha: 0, duration: 280, onComplete: () => e.destroy() });
    });
  }

  _hitPlayer() {
    if (this.invincible) return;
    this.lives = Math.max(0, this.lives - 1);
    this._updateUI();
    this.invincible = true;
    if (this.lives <= 0) {
      this.time.delayedCall(400, () => this.scene.start('NameEntry', { score: this.score, won: false }));
      this.player.setVelocityY(-300);
      return;
    }
    // Flash invincibility
    this.tweens.add({
      targets: this.player, alpha: 0.1,
      duration: 90, yoyo: true, repeat: 12,
      onComplete: () => { this.player.setAlpha(1); this.invincible = false; }
    });
    this.player.setVelocityY(-200);
  }

  _floatText(x, y, txt, color) {
    const t = this.add.text(x, y, txt, {
      fontSize:'16px', color, stroke:'#000', strokeThickness:3
    }).setDepth(15);
    this.tweens.add({ targets: t, y: y-50, alpha: 0, duration: 900,
      onComplete: () => t.destroy() });
  }

  update(_time, dt) {
    if (!this.player.active) return;

    if (Phaser.Input.Keyboard.JustDown(this.pauseKey)) this._togglePause();
    if (this.gamePaused) return;

    const onGround = this.player.body.blocked.down;
    const goLeft  = this.cursors.left.isDown  || this.wasd.left.isDown;
    const goRight = this.cursors.right.isDown || this.wasd.right.isDown;
    const doJump  = Phaser.Input.Keyboard.JustDown(this.cursors.up)    ||
                    Phaser.Input.Keyboard.JustDown(this.wasd.up)        ||
                    Phaser.Input.Keyboard.JustDown(this.cursors.space);

    // Horizontal movement
    if (goLeft)       { this.player.setVelocityX(-210); this.facing = -1; }
    else if (goRight) { this.player.setVelocityX(210);  this.facing =  1; }
    else              { this.player.setVelocityX(0); }

    // Jump
    if (doJump && onGround) this.player.setVelocityY(-540);

    // Flip sprite
    this.player.setFlipX(this.facing === -1);

    // Animate sprite
    this.animT += dt;
    if (!onGround) {
      this.player.setTexture('p_jump');
    } else if (goLeft || goRight) {
      if (this.animT > 110) {
        this.animT = 0;
        this.animF ^= 1;
        this.player.setTexture(this.animF ? 'p_run2' : 'p_run1');
      }
    } else {
      this.player.setTexture('p_idle');
    }

    // Animate coins
    this.coins.getChildren().forEach(c => { c.angle = (c.angle + dt * 0.18) % 360; });

    // Enemy patrol AI
    this.enemies.getChildren().forEach(e => {
      if (!e.alive) return;
      e.et = (e.et||0) + dt;
      if (e.et > 320) { e.et = 0; e.setTexture(e.texture.key === 'e1' ? 'e2' : 'e1'); }
      if (e.x <= e.patrolL) { e.setVelocityX(70); e.setFlipX(true); }
      else if (e.x >= e.patrolR) { e.setVelocityX(-70); e.setFlipX(false); }
    });

    // Fell into pit → respawn and lose life
    if (this.player.y > H + 60) {
      if (!this.invincible) this._hitPlayer();
      if (this.lives > 0) this.player.setPosition(Math.max(80, this.cameras.main.scrollX + 80), H - 160);
    }
  }
}

// ─── Game Over / Win Scene ────────────────────────────────────────────────────
class OverScene extends Phaser.Scene {
  constructor() { super('Over'); }
  init(d) { this.score = d.score; this.won = d.won; }

  create() {
    // Dim overlay
    this.add.rectangle(W/2, H/2, W, H, 0x0a2a0a, 0.82);

    this.add.text(W/2, 100, this.won ? '🏆  YOU WIN!  🏆' : 'GAME OVER', {
      fontSize: this.won ? '44px' : '52px',
      color: this.won ? '#FFD700' : '#FF5252',
      stroke: '#000', strokeThickness: 6, fontStyle: 'bold'
    }).setOrigin(0.5);

    this.add.text(W/2, 185, 'Score: ' + this.score, {
      fontSize:'30px', color:'#fff', stroke:'#000', strokeThickness:5
    }).setOrigin(0.5);

    if (this.won)
      this.add.text(W/2, 250, 'You made it through the forest!', {
        fontSize:'18px', color:'#A5D6A7', stroke:'#000', strokeThickness:3
      }).setOrigin(0.5);
    else
      this.add.text(W/2, 250, 'The forest defeated you...', {
        fontSize:'18px', color:'#EF9A9A', stroke:'#000', strokeThickness:3
      }).setOrigin(0.5);

    // Play again button
    const btn = this.add.text(W/2, 330, '[  Play Again  ]', {
      fontSize:'28px', color:'#81C784', stroke:'#000', strokeThickness:4, fontStyle:'bold'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    btn.on('pointerover', () => btn.setStyle({ color:'#fff' }));
    btn.on('pointerout',  () => btn.setStyle({ color:'#81C784' }));
    btn.on('pointerdown', () => this.scene.start('Game'));

    this.add.text(W/2, H-24, 'Arrow Keys / WASD to move  ·  Up / W / Space to jump', {
      fontSize:'13px', color:'#aaa', stroke:'#000', strokeThickness:2
    }).setOrigin(0.5);

    this.input.keyboard.once('keydown', () => this.scene.start('Game'));
  }
}

// ─── Name Entry Scene ─────────────────────────────────────────────────────────
class NameEntryScene extends Phaser.Scene {
  constructor() { super('NameEntry'); }

  init(data) {
    this.finalScore = data.score || 0;
    this.won = data.won || false;
    this.playerName = '';
    this.submitting = false;
  }

  create() {
    this.add.rectangle(0, 0, W, H, this.won ? 0x0a2a0a : 0x1a0808).setOrigin(0);

    this.add.text(W/2, 65, this.won ? 'YOU WIN!' : 'GAME OVER', {
      fontSize:'48px', color: this.won ? '#FFD700' : '#FF5252',
      stroke:'#000', strokeThickness:7, fontStyle:'bold'
    }).setOrigin(0.5);

    this.add.text(W/2, 130, 'Your score: ' + this.finalScore, {
      fontSize:'26px', color:'#fff', stroke:'#000', strokeThickness:4
    }).setOrigin(0.5);

    this.add.text(W/2, 185, 'Enter your name for the leaderboard:', {
      fontSize:'16px', color:'#A5D6A7', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5);

    // Input box background
    this.add.rectangle(W/2, 238, 320, 46, 0xffffff, 0.1)
      .setOrigin(0.5).setStrokeStyle(2, 0xFFD700);

    this.nameTxt = this.add.text(W/2, 238, '_', {
      fontSize:'26px', color:'#FFD700', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5);

    // Submit button
    this.submitBtn = this.add.text(W/2 - 85, 305, '[ Submit ]', {
      fontSize:'21px', color:'#81C784', stroke:'#000', strokeThickness:3, fontStyle:'bold'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    this.submitBtn.on('pointerover', () => this.submitBtn.setStyle({ color:'#fff' }));
    this.submitBtn.on('pointerout',  () => this.submitBtn.setStyle({ color:'#81C784' }));
    this.submitBtn.on('pointerdown', () => this._submit());

    // Skip button
    const skipBtn = this.add.text(W/2 + 85, 305, '[ Skip ]', {
      fontSize:'21px', color:'#888', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    skipBtn.on('pointerover', () => skipBtn.setStyle({ color:'#fff' }));
    skipBtn.on('pointerout',  () => skipBtn.setStyle({ color:'#888' }));
    skipBtn.on('pointerdown', () => this.scene.start('Leaderboard', { score: this.finalScore, won: this.won }));

    this.add.text(W/2, H - 25, 'Type your name  •  Enter or click Submit to continue', {
      fontSize:'13px', color:'#666', stroke:'#000', strokeThickness:2
    }).setOrigin(0.5);

    // Keyboard capture
    this.input.keyboard.on('keydown', (e) => {
      if (this.submitting) return;
      if (e.key === 'Backspace') {
        this.playerName = this.playerName.slice(0, -1);
      } else if (e.key === 'Enter') {
        this._submit();
        return;
      } else if (e.key.length === 1 && this.playerName.length < 16) {
        this.playerName += e.key;
      }
      this.nameTxt.setText(this.playerName || '_');
    });
  }

  _submit() {
    if (this.submitting) return;
    const name = this.playerName.trim();
    if (!name) {
      this.scene.start('Leaderboard', { score: this.finalScore, won: this.won });
      return;
    }
    this.submitting = true;
    this.submitBtn.setText('Saving...');
    this.submitBtn.disableInteractive();

    db.from('scores').insert({ name, score: this.finalScore }).then(({ error }) => {
      if (error) console.error('Supabase insert error:', error);
      this.scene.start('Leaderboard', { score: this.finalScore, won: this.won });
    });
  }
}

// ─── Leaderboard Scene ────────────────────────────────────────────────────────
class LeaderboardScene extends Phaser.Scene {
  constructor() { super('Leaderboard'); }

  init(data) {
    this.finalScore = data.score || 0;
    this.won = data.won || false;
  }

  create() {
    this.add.rectangle(0, 0, W, H, 0x0d1f0d).setOrigin(0);

    this.add.text(W/2, 28, 'Leaderboard', {
      fontSize:'38px', color:'#FFD700', stroke:'#000', strokeThickness:6, fontStyle:'bold'
    }).setOrigin(0.5);

    this.add.text(W/2, 68, 'Top 10 All-Time Scores', {
      fontSize:'15px', color:'#A5D6A7', stroke:'#000', strokeThickness:2
    }).setOrigin(0.5);

    this.statusTxt = this.add.text(W/2, H/2, 'Loading...', {
      fontSize:'20px', color:'#fff', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5);

    db.from('scores')
      .select('name, score')
      .order('score', { ascending: false })
      .limit(10)
      .then(({ data, error }) => {
        this.statusTxt.destroy();
        if (error) {
          this.add.text(W/2, H/2, 'Could not load scores.\nCheck console for details.', {
            fontSize:'17px', color:'#FF5252', stroke:'#000', strokeThickness:3, align:'center'
          }).setOrigin(0.5);
        } else {
          this._drawTable(data || []);
        }
      });

    // Buttons
    const playBtn = this.add.text(W/2 - 105, H - 28, '[ Play Again ]', {
      fontSize:'22px', color:'#81C784', stroke:'#000', strokeThickness:3, fontStyle:'bold'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    playBtn.on('pointerover', () => playBtn.setStyle({ color:'#fff' }));
    playBtn.on('pointerout',  () => playBtn.setStyle({ color:'#81C784' }));
    playBtn.on('pointerdown', () => this.scene.start('Game'));

    const menuBtn = this.add.text(W/2 + 110, H - 28, '[ Main Menu ]', {
      fontSize:'22px', color:'#888', stroke:'#000', strokeThickness:3
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    menuBtn.on('pointerover', () => menuBtn.setStyle({ color:'#fff' }));
    menuBtn.on('pointerout',  () => menuBtn.setStyle({ color:'#888' }));
    menuBtn.on('pointerdown', () => this.scene.start('Title'));
  }

  _drawTable(rows) {
    if (rows.length === 0) {
      this.add.text(W/2, H/2 - 10, 'No scores yet — be the first!', {
        fontSize:'20px', color:'#fff', stroke:'#000', strokeThickness:3
      }).setOrigin(0.5);
      return;
    }

    // Column headers
    const hStyle = { fontSize:'14px', color:'#FFD700', stroke:'#000', strokeThickness:2 };
    this.add.text(110, 96,  '#',     hStyle).setOrigin(0.5);
    this.add.text(310, 96,  'NAME',  hStyle).setOrigin(0.5);
    this.add.text(600, 96, 'SCORE', hStyle).setOrigin(0.5);

    const line = this.add.graphics();
    line.lineStyle(1, 0x4CAF50, 0.4);
    line.strokeLineShape(new Phaser.Geom.Line(60, 106, W - 60, 106));

    const medals = ['1st', '2nd', '3rd'];

    rows.forEach((row, i) => {
      const y = 122 + i * 26;
      const isMe = row.score === this.finalScore;
      const color = i === 0 ? '#FFD700' : isMe ? '#A5D6A7' : '#ddd';
      const rStyle = { fontSize:'15px', color, stroke:'#000', strokeThickness:2 };

      this.add.text(110, y, medals[i] || String(i + 1), rStyle).setOrigin(0.5);
      this.add.text(310, y, row.name, rStyle).setOrigin(0.5);
      this.add.text(600, y, row.score.toLocaleString(), rStyle).setOrigin(0.5);
    });
  }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  parent: 'game',
  backgroundColor: '#87CEEB',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: [TitleScene, GameScene, OverScene, NameEntryScene, LeaderboardScene]
});
</script>
